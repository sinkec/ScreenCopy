[advisories]
# These are "no longer maintained as a standalone crate", not vulnerabilities: zbus 6
# absorbed them. The tray library `ksni` needs zbus 5, so they stay until it moves on.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: needed by ksni through zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: needed by ksni through zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: needed by ksni through zbus 5" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
