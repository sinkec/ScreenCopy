<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241f31"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="#ffffff" opacity="0.08"/>
  <!-- TV -->
  <rect x="38" y="87" width="52" height="7" rx="3.5" fill="#f6f5f4"/>
  <rect x="58" y="78" width="12" height="11" fill="#c0bfbc"/>
  <rect x="20" y="28" width="88" height="54" rx="7" fill="#f6f5f4"/>
  <rect x="25" y="33" width="78" height="44" rx="3" fill="url(#screen)"/>
  <!-- The monitor being mirrored, as seen on the TV -->
  <rect x="33" y="41" width="35" height="24" rx="3" fill="url(#source)"/>
  <rect x="33" y="41" width="35" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
  <!-- Wireless waves -->
  <g fill="none" stroke="#99c1f1" stroke-linecap="round" stroke-width="4.5">
    <path d="M 76 58 a 8 8 0 0 1 8 8"/>
    <path d="M 76 48 a 18 18 0 0 1 18 18"/>
  </g>
  <circle cx="77" cy="65" r="3.5" fill="#99c1f1"/>
  <!-- Shows that the screen is being shared -->
  <circle cx="100" cy="28" r="20" fill="#e01b24" stroke="#ffffff" stroke-width="5"/>
</svg>
